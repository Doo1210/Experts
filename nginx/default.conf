server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = / { return 302 /experts/; }
    location = /experts { rewrite ^ /experts/index.html last; }
    location /experts/ {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ =404;
        error_page 404 = /experts/index.html;
    }
}
